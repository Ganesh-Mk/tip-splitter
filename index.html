<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip Splitter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Tip Splitter</h1>
    <p class="hint">Split a bill and tip between friends.</p>

    <form id="tip-form">
      <label>Bill amount (₹)
        <input id="bill" type="number" min="0" step="0.01" value="1200" required>
      </label>
      <label>Tip (%)
        <input id="tip" type="number" min="0" max="100" value="10" required>
      </label>
      <label>People
        <input id="people" type="number" min="1" value="3" required>
      </label>
      <label class="check">
        <input id="round-up" type="checkbox">
        Round each share up to the next ₹10
      </label>
      <button type="submit">Calculate</button>
      <button type="button" id="reset" class="secondary">Reset</button>
    </form>

    <section id="result" aria-live="polite"></section>
  </main>
  <footer class="credit">Tips calculated with help from GPT-4o</footer>
  <script src="script.js"></script>
</body>
</html>
